<!DOCTYPE html>
<!-- Static landing page deployed by the webserver role
     (roles/webserver/files/index.html -> /var/www/html/index.html). -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Lab 11 — Ansible Roles</title>
    <style>
      body { font-family: sans-serif; margin: 3rem auto; max-width: 40rem; }
      h1 { color: #2b6cb0; }
      code { background: #edf2f7; padding: 0.1rem 0.3rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>It works — served by Ansible Role!</h1>
    <p>
      This page was deployed by the <code>webserver</code> role:
      nginx was installed, configured from a Jinja2 template, and
      started by handlers.
    </p>
    <p>
      This lab refactors Lab 10 into a reusable role with
      <code>defaults/</code>, <code>vars/</code>, <code>tasks/</code>,
      <code>handlers/</code>, <code>files/</code> and <code>templates/</code>.
    </p>
  </body>
</html>
