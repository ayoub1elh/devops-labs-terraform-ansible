---
# Handlers for the webserver role.
#
# Handlers are special tasks that run ONCE, at the end of the
# play, and only if a task notified them by name. The template
# task in tasks/main.yml notifies "Restart nginx", so the
# service is restarted only when the config file actually
# changed — not on every playbook run.
- name: Restart nginx
  ansible.builtin.service:
    name: "{{ nginx_package_name }}"
    state: restarted
