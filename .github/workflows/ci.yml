# ci.yml — static checks only for the lab-05-aws-free-tier Terraform code.
#
# Security policy: CI NEVER runs terraform apply or destroy. Formatting,
# validation and security linting happen on every push/PR; actually
# creating AWS resources is a deliberate manual step by the learner.
# AWS credentials are only needed for the optional plan job, which uses
# OIDC (no long-lived access keys).

name: lab-05-aws-free-tier-ci

on:
  push:
    branches:
      - lab-05-aws-free-tier
  pull_request:
    branches:
      - main

# No write permissions required for fmt/validate.
permissions:
  contents: read

jobs:
  fmt-and-validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Check formatting (terraform fmt)
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform (backend-free, no credentials needed)
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  security-scan:
    name: Security scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install a pinned tfsec binary directly. The third-party
      # aquasecurity/tfsec-action tags have moved around (v0.1.4 no longer
      # exists), so we pin the release archive instead — same scanner, no
      # action-version surprises.
      - name: Install tfsec
        run: |
          curl -sSLo tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/download/v1.28.10/tfsec_1.28.10_linux_amd64.tar.gz
          tar -xzf tfsec.tar.gz tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

      # --soft-fail keeps this lab's pipeline green while still printing
      # every finding. Handling findings properly is the subject of lab-07.
      - name: Run tfsec
        run: tfsec --soft-fail .
