---
# .github/workflows/molecule.yml
# CI for lab-12: lint the role, then run the full Molecule test sequence
# (create -> converge -> idempotence -> verify -> destroy) in Docker on an
# ubuntu-latest runner. No cloud resources and no secrets are involved.

name: Molecule

on:
  push:
    branches:
      - lab-12-molecule-testing
  pull_request:
    branches:
      - main

# Minimal permissions: read repo contents only.
permissions:
  contents: read

jobs:
  molecule:
    name: Lint + Molecule test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ubuntu-latest runners already have the Docker daemon running, so
      # no extra Docker setup is needed. Docker Engine ships with the
      # daemon + CLI; the Python "docker" package is what Molecule's
      # Docker driver talks to.
      - name: Install Ansible, Molecule, and the Docker driver
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible \
            ansible-lint \
            molecule \
            "molecule-plugins[docker]" \
            docker

      - name: Show tool versions
        run: |
          ansible --version
          molecule --version

      - name: Lint the role and playbooks
        run: ansible-lint

      - name: Run Molecule test sequence
        run: molecule test
        working-directory: roles/webserver
