---
# requirements.yml — Ansible collections required by this lab.
# Installed locally with:  ansible-galaxy collection install -r requirements.yml
# and in CI before the playbook runs.
collections:
  # The amazon.aws collection provides the aws_ec2 dynamic inventory plugin
  # used by inventory/aws_ec2.yml.
  - name: amazon.aws
    version: ">=7.0.0,<9.0.0"
