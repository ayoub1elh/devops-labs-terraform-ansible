# ansible.cfg — Ansible configuration for the Lab 17 capstone.
# The default inventory is the dynamic AWS EC2 plugin
# (inventory/aws_ec2.yml); inventory/hosts.ini, generated by Terraform, is
# only a static fallback for local debugging.
#
# IMPORTANT: the private key path below is the conventional default for a lab
# machine. In production, prefer ssh-agent or AWS Systems Manager (SSM)
# instead of a key file on disk, and store vault passwords / keys in a secrets
# manager — never in the repo.

[defaults]
inventory           = inventory/aws_ec2.yml
remote_user         = ubuntu
private_key_file    = ~/.ssh/id_rsa
host_key_checking   = False
retry_files_enabled = False
forks               = 10
interpreter_python  = auto_silent

[inventory]
# Cache inventory results briefly so a playbook retry does not hammer the
# EC2 DescribeInstances API (also keeps runs fast and free of rate limits).
cache             = True
cache_plugin      = ansible.builtin.jsonfile
cache_connection  = /tmp/ansible_inventory_cache
cache_timeout     = 300
