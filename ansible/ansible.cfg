# ansible.cfg — Ansible configuration for Lab 14 (dynamic inventory).
#
# The two settings that matter for this lab:
#   * [inventory] enable_plugins — WITHOUT this, Ansible silently ignores the
#     amazon.aws.aws_ec2 plugin and the inventory file is "empty".
#   * host_key_checking = False — the lab rebuilds instances constantly, so
#     strict host-key checking would fail on every new IP. WARNING: this makes
#     you vulnerable to man-in-the-middle attacks on untrusted networks.
#     Prefer `export ANSIBLE_HOST_KEY_CHECKING=False` per-shell, or accept new
#     host keys interactively, in anything but a throwaway lab environment.

[defaults]
# Inventory is a DIRECTORY: Ansible reads every file inside it. Our plugin
# config lives at inventory/aws_ec2.yml.
inventory = inventory

# Convenience for throwaway lab instances — see the security warning above.
host_key_checking = False

# Let Ansible pick the right python on Ubuntu without noisy warnings.
interpreter_python = auto_silent

# Keep retry files out of the working tree (.gitignore covers them anyway).
retry_files_enabled = False

[inventory]
# The aws_ec2 plugin must be explicitly enabled or it will not run.
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.ini, ansible.builtin.yaml
