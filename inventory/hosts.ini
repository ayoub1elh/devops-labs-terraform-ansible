# Inventory for lab-10-playbooks.
#
# This lab targets the local machine itself (localhost) so it runs on any
# free environment without provisioning cloud VMs. The `ansible_connection=local`
# setting tells Ansible not to use SSH for these hosts.
#
# To manage real remote servers later, replace 127.0.0.1 with their IPs or
# hostnames and provide SSH credentials (e.g. ansible_user, ansible_ssh_private_key_file).

[webservers]
127.0.0.1 ansible_connection=local
