# inventory/hosts.ini — static inventory for the lab.
#
# By default the only host is localhost, reached over a *local* connection
# (no SSH), which is what makes the CI deploy job work on the free
# ubuntu-latest runner.
#
# To target a real machine instead, either edit this file or override the
# host variables on the command line / in GitHub Secrets — see README
# ("Pointing the workflow at a real target").

[web]
localhost ansible_connection=local

[web:vars]
# ansible_host / ansible_user can be overridden at runtime, e.g.:
#   ansible-playbook -i inventory/hosts.ini site.yml \
#     -e "ansible_host=203.0.113.10 ansible_user=ubuntu"
