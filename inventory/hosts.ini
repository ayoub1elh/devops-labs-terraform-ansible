# inventory/hosts.ini — static INI inventory for lab-09-ansible-basics
#
# This lab targets localhost so it runs on any machine with Ansible
# installed and nothing to provision. IN REAL LIFE, the hosts below
# would be REMOTE machines (e.g. 54.10.0.11). We give each one a
# distinct ansible_host label (node-web-1, node-db-1) so you can
# mentally map them to real servers; every host still resolves to
# localhost here via ansible_host + ansible_connection=local.

# Web tier: would normally be Nginx/Apache app servers.
[webservers]
node-web-1 ansible_host=127.0.0.1 ansible_connection=local

# Database tier: would normally be a PostgreSQL/MySQL server.
# NOTE: this is a SECOND logical host, even though it points at the
# same localhost IP — in a real deployment it would be a separate box.
[dbservers]
node-db-1 ansible_host=127.0.0.1 ansible_connection=local

# Meta-group so `ansible all ...` covers both tiers at once.
# (Both children already exist above; this is just a convenience alias.)
[all:children]
webservers
dbservers
