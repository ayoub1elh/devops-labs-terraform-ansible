# Inventory for Lab 11 (Roles).
#
# The play in site.yml targets the `webservers` group.
# Replace the example host below with a machine you control.
#
# Examples:
#   # Local VM forwarded to port 2222 (e.g. `vagrant` or
#   # `multipass` with port forwarding):
#   web1 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=vagrant
#
#   # A cloud instance reached over SSH (keys via ssh-agent):
#   web1 ansible_host=203.0.113.10 ansible_user=ubuntu
#
#   # A Vagrant private-network VM (see README Prerequisites):
#   web1 ansible_host=192.168.56.10 ansible_user=vagrant
[webservers]
web1 ansible_host=192.168.56.10 ansible_user=vagrant
