# ansible.cfg — Lab 11 (Roles) local Ansible configuration.
#
# Placing this file next to site.yml makes the lab self-contained:
# Ansible automatically reads ./ansible.cfg when you run commands
# from this directory.

[defaults]
# Use the inventory shipped with the lab.
inventory = inventory/hosts.ini

# Training-lab convenience: don't prompt to accept host SSH keys.
# (Set to True in production, or pre-seed known_hosts.)
host_key_checking = False

# Keep the project tidy: no *.retry files after failed runs.
retry_files_enabled = False

# Pick an interpreter sensibly on hosts with/without python3.
interpreter_python = auto_silent

[privilege_escalation]
# Become method used with `become: true` (default is fine on Linux).
become_method = sudo
