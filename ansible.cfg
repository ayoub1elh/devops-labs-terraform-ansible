# ansible.cfg — Ansible configuration for lab-10-playbooks.
#
# Settings here apply automatically whenever you run ansible / ansible-playbook
# from the directory that contains this file (or below it). They keep every
# command short and consistent for the whole lab.

[defaults]
# Use our inventory file unless a command overrides it with -i.
inventory = inventory/hosts.ini

# Host key checking prompts you to accept each new SSH host key. With only
# localhost in this lab it is unnecessary; disable it to keep runs quiet.
host_key_checking = False

# How many hosts Ansible talks to at once (irrelevant for 1 host, good default).
forks = 10

# Ansible's default output omits task names; this "stdout callback" shows the
# name of each task as it runs, which is much friendlier for beginners.
stdout_callback = default
display_skipped_hosts = True

[privilege_escalation]
# become: true is set on the play itself; these are the defaults it uses.
become_method = sudo
become_ask_pass = False
