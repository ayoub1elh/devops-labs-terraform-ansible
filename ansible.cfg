# ansible.cfg — Ansible configuration for this lab.
# Defaults for local runs. CI overrides host_key_checking via the
# ANSIBLE_HOST_KEY_CHECKING environment variable (see README and workflow).

[defaults]
# Default inventory so you can run "ansible-playbook site.yml" without -i.
inventory = inventory/hosts.ini
# Roles are resolved relative to the repo (./roles).
roles_path = roles
# Keep host key checking ON for real interactive runs. CI disables it via
# the ANSIBLE_HOST_KEY_CHECKING environment variable only — see README.
host_key_checking = True
# Do not litter the repo with .retry files on failure.
retry_files_enabled = False
# Human-readable, diff-friendly output.
stdout_callback = yaml
# Pick the right Python on modern Ubuntu without warnings.
interpreter_python = auto_silent

[ssh_connection]
# Speed up repeated SSH connections to real targets.
pipelining = True
