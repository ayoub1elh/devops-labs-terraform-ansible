# ansible.cfg — local configuration for lab-09-ansible-basics
#
# Ansible looks for this file in the current directory first (see
# `ansible --version` for the search order), so commands run from this
# lab directory automatically pick up these settings instead of relying
# on global defaults in /etc/ansible/ansible.cfg.

[defaults]
# Tell Ansible where to find our static INI inventory. Without this we
# would have to pass `-i inventory/hosts.ini` to every ad-hoc command.
inventory = inventory/hosts.ini

# Run up to 5 hosts in parallel. Fine for a 2-host inventory; the main
# point is that it is set explicitly rather than relying on the default.
forks = 5

# Let Ansible auto-detect the Python interpreter on the target host.
# On modern Ubuntu/Debian targets this avoids the deprecation warning
# about the default /usr/bin/python not being found.
interpreter_python = auto_silent

# SSH host key checking. In real life (remote hosts) you want this ON
# to prevent MITM attacks. Our targets are localhost with a local
# connection, so checking is pointless, and turning it off also saves
# us from accept-host-key prompts when experimenting with SSH targets.
host_key_checking = false

[privilege_escalation]
# For this first lab everything runs against localhost without sudo.
# Real playbooks usually enable become here or per-task.
become = false
